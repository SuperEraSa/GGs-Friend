<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GG's Friend</title>
<meta name="description" content="A calm, always-there chat companion for GG.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-a: #eaf3f1;
    --bg-b: #e7ecfb;
    --bg-c: #f3ece2;
    --surface: rgba(255, 255, 255, 0.62);
    --surface-strong: rgba(255, 255, 255, 0.82);
    --surface-border: rgba(255, 255, 255, 0.8);
    --ink: #2e3444;
    --ink-soft: #667085;
    --ink-faint: #97a0b0;
    --accent: #3f8f81;
    --accent-ink: #ffffff;
    --accent-soft: #dcefea;
    --user-bubble: linear-gradient(135deg, #4fae9e, #4f8fa6);
    --assistant-bubble: var(--surface-strong);
    --assistant-border: rgba(255, 255, 255, 0.9);
    --shadow-soft: 0 8px 30px rgba(60, 80, 100, 0.10);
    --shadow-lift: 0 14px 40px rgba(60, 80, 100, 0.16);
    --ring: rgba(63, 143, 129, 0.35);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-a: #131924;
      --bg-b: #1a2130;
      --bg-c: #17202a;
      --surface: rgba(255, 255, 255, 0.055);
      --surface-strong: rgba(255, 255, 255, 0.08);
      --surface-border: rgba(255, 255, 255, 0.12);
      --ink: #e8ecf3;
      --ink-soft: #a7b0bf;
      --ink-faint: #6e7787;
      --accent: #6fc6b6;
      --accent-ink: #0f1a17;
      --accent-soft: rgba(111, 198, 182, 0.14);
      --user-bubble: linear-gradient(135deg, #3f8b7c, #3f6b85);
      --assistant-bubble: rgba(255, 255, 255, 0.07);
      --assistant-border: rgba(255, 255, 255, 0.14);
      --shadow-soft: 0 8px 30px rgba(0, 0, 0, 0.35);
      --shadow-lift: 0 14px 40px rgba(0, 0, 0, 0.45);
      --ring: rgba(111, 198, 182, 0.4);
    }
  }

  :root[data-theme="dark"] {
    --bg-a: #131924;
    --bg-b: #1a2130;
    --bg-c: #17202a;
    --surface: rgba(255, 255, 255, 0.055);
    --surface-strong: rgba(255, 255, 255, 0.08);
    --surface-border: rgba(255, 255, 255, 0.12);
    --ink: #e8ecf3;
    --ink-soft: #a7b0bf;
    --ink-faint: #6e7787;
    --accent: #6fc6b6;
    --accent-ink: #0f1a17;
    --accent-soft: rgba(111, 198, 182, 0.14);
    --user-bubble: linear-gradient(135deg, #3f8b7c, #3f6b85);
    --assistant-bubble: rgba(255, 255, 255, 0.07);
    --assistant-border: rgba(255, 255, 255, 0.14);
    --shadow-soft: 0 8px 30px rgba(0, 0, 0, 0.35);
    --shadow-lift: 0 14px 40px rgba(0, 0, 0, 0.45);
    --ring: rgba(111, 198, 182, 0.4);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
    background: var(--bg-a);
    background-image:
      radial-gradient(60% 50% at 15% 10%, var(--bg-b) 0%, transparent 60%),
      radial-gradient(55% 45% at 90% 15%, var(--bg-c) 0%, transparent 60%),
      radial-gradient(70% 60% at 50% 100%, var(--bg-b) 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-a), var(--bg-a));
    background-attachment: fixed;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
  }

  .aurora {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.55;
  }
  .aurora span {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.5;
  }
  .aurora span:nth-child(1) {
    width: 38vmax; height: 38vmax;
    top: -10vmax; left: -8vmax;
    background: radial-gradient(circle, var(--accent-soft), transparent 70%);
    animation: drift1 26s ease-in-out infinite alternate;
  }
  .aurora span:nth-child(2) {
    width: 32vmax; height: 32vmax;
    bottom: -12vmax; right: -6vmax;
    background: radial-gradient(circle, var(--bg-b), transparent 70%);
    animation: drift2 30s ease-in-out infinite alternate;
  }
  @keyframes drift1 {
    from { transform: translate(0, 0) scale(1); }
    to { transform: translate(4vmax, 3vmax) scale(1.08); }
  }
  @keyframes drift2 {
    from { transform: translate(0, 0) scale(1); }
    to { transform: translate(-3vmax, -4vmax) scale(1.05); }
  }
  @media (prefers-reduced-motion: reduce) {
    .aurora span { animation: none; }
  }

  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    height: min(760px, 92vh);
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 28px;
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    box-shadow: var(--shadow-lift);
    overflow: hidden;
  }

  .app__header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 20px;
    border-bottom: 1px solid var(--surface-border);
    background: var(--surface-strong);
    flex: 0 0 auto;
  }

  .breathe {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    flex: 0 0 auto;
    background: radial-gradient(circle at 35% 30%, var(--accent), transparent 70%), var(--accent-soft);
    box-shadow: 0 0 0 1px var(--surface-border);
    animation: breathe 5.5s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(0.92); }
    50% { transform: scale(1.06); }
  }
  @media (prefers-reduced-motion: reduce) {
    .breathe { animation: none; }
  }

  .app__title { display: flex; flex-direction: column; gap: 2px; }
  .app__title h1 {
    margin: 0;
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.01em;
  }
  .app__title p {
    margin: 0;
    font-size: 0.78rem;
    color: var(--ink-soft);
  }

  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
    display: inline-block;
    margin-right: 5px;
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .app__body {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }
  .app__body::-webkit-scrollbar { width: 8px; }
  .app__body::-webkit-scrollbar-thumb {
    background: var(--surface-border);
    border-radius: 8px;
  }

  .row { display: flex; width: 100%; }
  .row--user { justify-content: flex-end; }
  .row--assistant { justify-content: flex-start; }

  .bubble {
    max-width: 82%;
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 0.94rem;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: rise 0.28s ease both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .bubble { animation: none; }
  }

  .bubble--assistant {
    background: var(--assistant-bubble);
    border: 1px solid var(--assistant-border);
    color: var(--ink);
    border-bottom-left-radius: 6px;
  }

  .bubble--user {
    background: var(--user-bubble);
    color: var(--accent-ink);
    border-bottom-right-radius: 6px;
    box-shadow: var(--shadow-soft);
  }

  .bubble--error {
    background: transparent;
    border: 1px dashed var(--ink-faint);
    color: var(--ink-soft);
    font-size: 0.85rem;
  }

  .typing {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 14px 16px;
  }
  .typing span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--ink-faint);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .typing span { animation: none; opacity: 0.8; }
  }

  .app__footer {
    flex: 0 0 auto;
    padding: 14px 16px;
    border-top: 1px solid var(--surface-border);
    background: var(--surface-strong);
  }

  .composer {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 20px;
    padding: 8px 8px 8px 16px;
  }
  .composer:focus-within {
    box-shadow: 0 0 0 3px var(--ring);
  }

  textarea#input {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 0.94rem;
    line-height: 1.4;
    max-height: 120px;
    padding: 8px 0;
  }
  textarea#input::placeholder { color: var(--ink-faint); }

  #send {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: var(--accent);
    color: var(--accent-ink);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  #send:hover:not(:disabled) { transform: scale(1.06); }
  #send:disabled { opacity: 0.45; cursor: default; }
  #send svg { width: 17px; height: 17px; }

  .hint {
    text-align: center;
    font-size: 0.7rem;
    color: var(--ink-faint);
    margin-top: 8px;
  }

  .gate {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-a);
    padding: 24px;
  }
  .gate__card {
    width: 100%;
    max-width: 340px;
    background: var(--surface-strong);
    border: 1px solid var(--surface-border);
    border-radius: 22px;
    padding: 28px 24px;
    text-align: center;
    box-shadow: var(--shadow-lift);
    backdrop-filter: blur(18px);
  }
  .gate__card h2 {
    font-family: 'Quicksand', sans-serif;
    margin: 14px 0 6px;
    font-size: 1.1rem;
  }
  .gate__card p { color: var(--ink-soft); font-size: 0.85rem; margin: 0 0 16px; }
  .gate__card input {
    width: 100%;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid var(--surface-border);
    background: var(--surface);
    color: var(--ink);
    font-size: 0.9rem;
    outline: none;
    margin-bottom: 10px;
  }
  .gate__card input:focus { box-shadow: 0 0 0 3px var(--ring); }
  .gate__card button {
    width: 100%;
    padding: 10px 14px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  .gate__error {
    color: #c25656;
    font-size: 0.8rem;
    min-height: 1em;
    margin-top: 8px;
  }
  .gate[hidden] { display: none; }

  @media (max-width: 520px) {
    body { padding: 0; }
    .app { max-width: 100%; height: 100vh; border-radius: 0; }
  }
</style>
</head>
<body>

<div class="aurora" aria-hidden="true"><span></span><span></span></div>

<div class="gate" id="gate">
  <div class="gate__card">
    <div class="breathe" style="margin: 0 auto;"></div>
    <h2>Hi, this space is just for GG</h2>
    <p>Enter the passcode to open it.</p>
    <input type="password" id="gate-input" placeholder="Passcode" autocomplete="off">
    <button id="gate-submit" type="button">Open</button>
    <div class="gate__error" id="gate-error"></div>
  </div>
</div>

<main class="app" id="app" hidden>
  <header class="app__header">
    <div class="breathe" aria-hidden="true"></div>
    <div class="app__title">
      <h1>GG's Friend</h1>
      <p><span class="status-dot" aria-hidden="true"></span>here whenever you need it</p>
    </div>
  </header>

  <section class="app__body" id="chat" aria-live="polite"></section>

  <footer class="app__footer">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Say anything..." aria-label="Message"></textarea>
      <button id="send" type="button" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
      </button>
    </div>
    <p class="hint">GG's Friend can make mistakes. For anything urgent, reach a real person.</p>
  </footer>
</main>

<script>
(function () {
  const chatEl = document.getElementById('chat');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const appEl = document.getElementById('app');
  const gateEl = document.getElementById('gate');
  const gateInput = document.getElementById('gate-input');
  const gateSubmit = document.getElementById('gate-submit');
  const gateError = document.getElementById('gate-error');

  const WELCOME = "Hey GG, I'm here. Whatever's going on — a question, a worry, something random — you can just say it. What's on your mind right now?";
  const STORAGE_KEY = 'ggs-friend-history-v1';
  const PASSCODE_KEY = 'ggs-friend-passcode';

  let history = [];
  let sending = false;

  function loadHistory() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return parsed;
      }
    } catch (e) {}
    return [];
  }

  function saveHistory() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history.slice(-60)));
    } catch (e) {}
  }

  function renderBubble(role, text, opts) {
    opts = opts || {};
    const row = document.createElement('div');
    row.className = 'row ' + (role === 'user' ? 'row--user' : 'row--assistant');
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (opts.error ? 'bubble--error' : (role === 'user' ? 'bubble--user' : 'bubble--assistant'));
    bubble.textContent = text;
    row.appendChild(bubble);
    chatEl.appendChild(row);
    chatEl.scrollTop = chatEl.scrollHeight;
    return bubble;
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'row row--assistant';
    row.id = 'typing-row';
    const bubble = document.createElement('div');
    bubble.className = 'bubble bubble--assistant typing';
    bubble.innerHTML = '<span></span><span></span><span></span>';
    row.appendChild(bubble);
    chatEl.appendChild(row);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function hideTyping() {
    const row = document.getElementById('typing-row');
    if (row) row.remove();
  }

  function autoGrow() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || sending) return;

    sending = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    autoGrow();

    renderBubble('user', text);
    history.push({ role: 'user', content: text });
    saveHistory();

    showTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-ggs-passcode': sessionStorage.getItem(PASSCODE_KEY) || ''
        },
        body: JSON.stringify({ messages: history })
      });

      hideTyping();

      if (!res.ok) {
        const errBody = await res.json().catch(function () { return {}; });
        renderBubble('assistant', errBody.error || "Something went sideways on my end — mind trying that again in a moment?", { error: true });
        sending = false;
        sendBtn.disabled = false;
        return;
      }

      const data = await res.json();
      const reply = data.reply || "I didn't quite catch that — could you say it again?";
      renderBubble('assistant', reply);
      history.push({ role: 'assistant', content: reply });
      saveHistory();
    } catch (err) {
      hideTyping();
      renderBubble('assistant', "I couldn't connect just now. Check your connection and try again?", { error: true });
    } finally {
      sending = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  inputEl.addEventListener('input', autoGrow);

  function initChat() {
    history = loadHistory();
    if (history.length === 0) {
      renderBubble('assistant', WELCOME);
      history.push({ role: 'assistant', content: WELCOME });
      saveHistory();
    } else {
      history.forEach(function (m) { renderBubble(m.role, m.content); });
    }
    inputEl.focus();
  }

  function openApp() {
    gateEl.hidden = true;
    appEl.hidden = false;
    initChat();
  }

  const savedPass = sessionStorage.getItem(PASSCODE_KEY);
  if (savedPass !== null) {
    openApp();
  }

  gateSubmit.addEventListener('click', async function () {
    const val = gateInput.value;
    if (!val) {
      gateError.textContent = 'Enter the passcode.';
      return;
    }
    gateSubmit.disabled = true;
    gateError.textContent = '';
    try {
      const res = await fetch('/api/verify', {
        method: 'POST',
        headers: { 'x-ggs-passcode': val }
      });
      if (res.ok) {
        sessionStorage.setItem(PASSCODE_KEY, val);
        openApp();
      } else {
        gateError.textContent = "That's not quite it — try again.";
      }
    } catch (err) {
      gateError.textContent = "Couldn't reach the server — check your connection.";
    } finally {
      gateSubmit.disabled = false;
    }
  });
  gateInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') gateSubmit.click();
  });
})();
</script>
</body>
</html>
